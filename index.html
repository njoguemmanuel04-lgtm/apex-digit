<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX DIGITS V2 - LIVE TRADING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:system-ui;padding:10px}
.top{display:flex;gap:8px}
.balance{flex:1;background:#00ff66;color:black;border-radius:12px;padding:10px;font-weight:900}
.signup{background:#ffcc00;color:black;border:0;border-radius:12px;padding:10px 16px;font-weight:900}
.row{display:flex;gap:8px;margin-top:10px}
.box{flex:1;border-radius:16px;padding:10px;text-align:center;font-weight:900}
.sl{background:#1a0000;border:2px solid #ff0044;color:#ff0044}
.tp{background:#001a00;border:2px solid #00ff66;color:#00ff66}
.box b{display:block;font-size:14px;margin-bottom:4px}
.ctrl{display:flex;align-items:center;justify-content:space-between;background:#1a1a1a;padding:8px;border-radius:12px;margin-top:8px}
.ctrl button{width:42px;height:42px;border:0;border-radius:10px;font-size:20px;font-weight:900}
.ctrl div{font-weight:900;font-size:22px}
.auto{margin-top:10px;background:#00ff66;color:black;padding:14px;border-radius:20px;text-align:center;font-weight:900;font-size:16px;border:0;width:100%}
.info{margin-top:10px;background:#111;border:1px solid #333;border-radius:12px;padding:10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.digit{border-radius:16px;padding:12px 2px;text-align:center;background:#111;border:2px solid #333}
.digit.hot{background:#00ff66;color:black;border-color:#00ff66}
.digit.cold{background:#1a1a1a;border:2px solid #333;opacity:.6}
.digit b{font-size:22px;display:block}
.bot{margin-top:10px;background:#111;border:1px solid #333;border-radius:16px;padding:12px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="top">
<div class="balance" id="bal">Bal: $0.00</div>
<button class="signup" onclick="login()">📝 SIGN UP</button>
</div>
<div class="row">
<div class="box sl"><b>- $20</b>Auto stop if loss -$20</div>
<div class="box tp"><b>+ $50</b>Auto stop if profit +$50</div>
</div>
<button class="auto" id="autoBtn" onclick="toggleAuto()">⏸️ AUTO OFF | Session +0.00 | Bal 0.00</button>
<div class="row">
<div class="box" style="background:#222">Stake: $<span id="stake">0.35</span></div>
<div class="box" style="background:#222">Profit: <span id="profit" style="color:#00ff66">+0.00</span></div>
<div class="box" style="background:#222">Martingale: <span id="mart">1x</span></div>
</div>
<div class="info" id="info">Ticks - | Active: NONE | Last100: 0 | WS: OFF<br><span style="color:yellow;font-weight:900">Please TAP SIGN UP to LOGIN to Deriv</span><br>SL:0.00/-$20 TP:0.00/$50 | Last digit: -</div>
<div class="grid" id="grid"></div>
<div id="bots"></div>
<div style="margin-top:10px;background:#111;border-radius:10px;padding:10px;font-family:monospace;font-size:12px" id="log">🚀 APEX V2 Ready... Waiting for login...</div>
<script>
const APP_ID="34qyJGBERhw2zjIw8hKtD";
const REDIRECT="https://apex-digit.vercel.app/callback.html";
let token=localStorage.getItem("deriv_token")||"",ws,balance=0,last100=[],digits={},stake=0.35,session=0,auto=false;
function login(){location.href=`https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN&brand=deriv&redirect_uri=${REDIRECT}`;}
function toggleAuto(){auto=!auto;document.getElementById("autoBtn").innerText=(auto?"▶️ AUTO ON":"⏸️ AUTO OFF")+` | Session ${session>=0?"+":""}${session.toFixed(2)} | Bal ${balance.toFixed(2)}`;}
function renderDigits(){
let g=document.getElementById("grid");g.innerHTML="";
for(let i=0;i<10;i++){
let c=digits[i]||{count:0,last:999},pct=last100.length?Math.round((c.count/last100.length)*100):0;
let hot=Object.values(digits).sort((a,b)=>b.count-a.count)[0];let isHot=hot&&c.count==hot.count&&c.count>0;
g.innerHTML+=`<div class="digit ${isHot?"hot":""}"><b>${i}</b>${pct}%<br><span style="color:#00ff66;font-size:11px">${c.count}M</span><br><span style="font-size:10px">${c.last>100?"100+":c.last} ago</span></div>`;
}
let html="";
let hotDigit=Object.keys(digits).reduce((a,b)=>digits[a]&&digits[b]&&digits[a].count>digits[b].count?a:b,0);
html+=`<div class="bot" style="border-color:#00ff66"><div>🤖 MATCHES Kingpin 1 🟢 WAIT<br><small>${digits[hotDigit]?digits[hotDigit].count:0}M HOT | Coldest:${Object.keys(digits).reduce((a,b)=>digits[a]&&digits[b]&&digits[a].last>digits[b].last?a:b,0)}(0M)</small></div><button style="background:#00ff66;border:0;padding:10px 20px;border-radius:12px;font-weight:900" onclick="fire('${hotDigit}')">FIRE</button></div>`;
html+=`<div class="bot" style="border-color:#4488ff"><div>EVEN Bot 🟢 WAIT<br><small>0% EVEN | Normal</small></div><button style="background:#88bbff;border:0;padding:10px 20px;border-radius:12px;font-weight:900">FIRE</button></div>`;
html+=`<div class="bot" style="border-color:#ff8844"><div>ODD Bot 🟢 WAIT<br><small>0% ODD | Normal</small></div><button style="background:#ffaa66;border:0;padding:10px 20px;border-radius:12px;font-weight:900">FIRE</button></div>`;
html+=`<div class="bot" style="border-color:#ffcc00"><div>OVER/UNDER Bot 🟢 WAIT<br><small>OVER 0% UNDER 0%</small></div><button style="background:#ffdd55;border:0;padding:10px 20px;border-radius:12px;font-weight:900">FIRE</button></div>`;
document.getElementById("bots").innerHTML=html;
}
function connect(){
if(!token){renderDigits();return;}
ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
ws.onopen=()=>{ws.send(JSON.stringify({authorize:token}));};
ws.onmessage=(e)=>{
let d=JSON.parse(e.data);
if(d.authorize){balance=parseFloat(d.authorize.balance);document.getElementById("bal").innerText=`Bal: $${balance.toFixed(2)}`;ws.send(JSON.stringify({ticks:"R_100",subscribe:1}));ws.send(JSON.stringify({balance:1,subscribe:1}));}
if(d.tick){let last=d.tick.quote.toFixed(2).slice(-1);last100.unshift(parseInt(last));if(last100.length>100)last100.pop();for(let i=0;i<10;i++)if(!digits[i])digits[i]={count:0,last:0};Object.keys(digits).forEach(k=>digits[k].last++);if(!digits[last])digits[last]={count:0,last:0};digits[last].count++;digits[last].last=0;document.getElementById("info").innerHTML=`Ticks ${d.tick.quote} | Active: R_100 | Last100: ${last100.length} | WS: <span style="color:#00ff66">LIVE ✅</span><br>SL:${session.toFixed(2)}/-$20 TP:${session.toFixed(2)}/$50 | Last digit: ${last}`;renderDigits();}
if(d.balance){balance=parseFloat(d.balance.balance);document.getElementById("bal").innerText=`Bal: $${balance.toFixed(2)}`;}
};
ws.onclose=()=>{document.getElementById("info").innerHTML+=` | WS: <span style="color:red">OFF</span>`;setTimeout(connect,3000);};
}
function fire(d){document.getElementById("log").innerText=`🔥 FIRING DIGIT ${d} | Stake $${stake} | Bal $${balance.toFixed(2)}`;}
if(token)document.querySelector(".signup").innerText="✅ LOGGED IN";
connect();renderDigits();
</script>
</body>
</html>
