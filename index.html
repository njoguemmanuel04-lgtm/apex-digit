<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>APEX DIGITS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:system-ui;max-width:430px;margin:0 auto;padding:10px}
.top{display:flex;gap:8px}
.balance{flex:1;background:#00ff66;color:black;border-radius:18px;padding:12px;text-align:center;font-weight:900;font-size:18px}
.signup{background:#ffcc00;color:black;border-radius:18px;padding:12px 16px;font-weight:900;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px}
.box{flex:1;border-radius:16px;padding:10px}
.sl{background:#1a0000;border:2px solid #ff0000}
.tp{background:#001a00;border:2px solid #00cc66}
.box b{display:block;font-size:14px;margin-bottom:6px}
.ctrl{display:flex;align-items:center;justify-content:space-between}
.ctrl button{width:42px;height:42px;border-radius:12px;border:none;font-size:20px;font-weight:900}
.ctrl div{font-weight:900;font-size:22px}
.auto{margin-top:10px;background:#00ff66;color:black;border-radius:16px;padding:12px;text-align:center;font-weight:900;border:2px solid white;cursor:pointer}
.info{margin-top:10px;background:#111;border-radius:12px;padding:10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.digit{border-radius:16px;padding:12px 2px;text-align:center;background:#1a1a1a;border:1px solid #333}
.digit.hot{background:#00ff66;color:black;border:3px solid white}
.digit b{font-size:22px;display:block}
.bot{margin-top:10px;background:#111;border-radius:16px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.fire{font-weight:900;padding:10px 18px;border-radius:12px;border:none;color:black;cursor:pointer}
</style>
</head>
<body>

<div class="top">
<div class="balance" id="bal">✅ DEMO $1118.78</div>
<div class="signup" onclick="login()">📝 SIGN UP</div>
</div>

<div class="row">
<div class="box sl">
<b style="color:#ff0000">🛑 STOP LOSS</b>
<div class="ctrl"><button onclick="chgSL(-1)" style="background:#333;color:white">-</button><div style="color:#ff3333" id="sl">$20</div><button onclick="chgSL(1)" style="background:#cc0000;color:white">+</button></div>
<div style="font-size:11px;opacity:0.6;margin-top:4px">Auto stop if loss <span id="sltxt">-$20</span></div>
</div>
<div class="box tp">
<b style="color:#00ff88">🎯 TAKE PROFIT</b>
<div class="ctrl"><button onclick="chgTP(-1)" style="background:#333;color:white">-</button><div style="color:#00ff88" id="tp">$50</div><button onclick="chgTP(1)" style="background:#00cc66;color:white">+</button></div>
<div style="font-size:11px;opacity:0.6;margin-top:4px">Auto stop if profit +<span id="tptxt">$50</span></div>
</div>
</div>

<div class="auto" id="autobar" onclick="toggleAuto()">⏸️ AUTO OFF | Session +5.44 | Bal 1118.78</div>

<div class="info">
<div style="color:#00ff88">Ticks <span id="tick">9650.38</span> | Active: <span id="active">NONE</span> | Last100: <span id="l100">0</span></div>
<div id="loginmsg" style="color:#ffcc00;font-weight:800;font-size:16px">Please LOGIN to Deriv</div>
<div style="color:#888;font-size:12px">SL:<span id="slinfo">5.44/-$20</span> TP:<span id="tpinfo">5.44/$50</span></div>
</div>

<div class="grid" id="digitGrid"></div>

<div id="bots"></div>

<script>
const APP_ID="34qyJGBERhw2zjIw8hKtD";
let balance=1118.78, sl=20, tp=50, isAuto=false, last=[], counts=Array(10).fill(0), active="NONE", ws=null;
function login(){ location.href=`https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}`; }
function chgSL(d){ sl=Math.max(1,sl+d); document.getElementById("sl").innerText="$"+sl; document.getElementById("sltxt").innerText="-$"+sl; document.getElementById("slinfo").innerText="5.44/-$"+sl; }
function chgTP(d){ tp=Math.max(1,tp+d); document.getElementById("tp").innerText="$"+tp; document.getElementById("tptxt").innerText="$"+tp; document.getElementById("tpinfo").innerText="5.44/$"+tp; }
function toggleAuto(){ isAuto=!isAuto; document.getElementById("autobar").innerText=(isAuto?"▶️ AUTO ON":"⏸️ AUTO OFF")+` | Session +5.44 | Bal ${balance.toFixed(2)}`; document.getElementById("autobar").style.background=isAuto?"#ffcc00":"#00ff66"; }

function renderDigits(){
 let h=""; for(let i=0;i<10;i++){ let c=last.filter(x=>x===i).length; let p=last.length?Math.round(c/last.length*100):0; let hot=i===0; h+=`<div class="digit ${hot?'hot':''}"><b>${i}</b><div style="font-size:12px">${p}%</div><div style="font-size:11px;color:${hot?'black':'#00ff88'};font-weight:800">${c}M</div>${hot?'<div>👑 🧊</div>':''}</div>`; } document.getElementById("digitGrid").innerHTML=h;
}
function renderBots(){
 const bots=[{name:"MATCHES Kingpin 1",sub:"0M HOT | Coldest:0(5M)",col:"#00ff66",br:"#00ff66",icon:"🤖 "},{name:"EVEN Bot",sub:"0% EVEN | Normal",col:"#6da8ff",br:"#3b82ff",icon:""},{name:"ODD Bot",sub:"100% ODD | Normal",col:"#ff9a42",br:"#ff7a00",icon:""},{name:"OVER/UNDER Bot",sub:"OVER 45% UNDER 55%",col:"#ffdd57",br:"#ffcc00",icon:""}];
 document.getElementById("bots").innerHTML=bots.map(b=>`<div class="bot" style="border:2px solid ${b.br}"><div><div style="font-weight:900">${b.icon}${b.name} 🟢 WAIT</div><div style="font-size:12px;opacity:0.7">${b.name.includes('MATCHES')?'👑 ':''}${b.sub}</div></div><button class="fire" style="background:${b.col}" onclick="fire('${b.name}')">FIRE</button></div>`).join("");
}
function fire(name){ active=name; document.getElementById("active").innerText=name; alert(name+" FIRED! 🔥"); }
function connect(tok){
 ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
 ws.onopen=()=>ws.send(JSON.stringify({authorize:tok}));
 ws.onmessage=(e)=>{ const d=JSON.parse(e.data); if(d.authorize){ balance=d.authorize.balance; document.getElementById("bal").innerText=`✅ ${d.authorize.currency} $${balance}`; document.getElementById("loginmsg").innerText=`CONNECTED - ${d.authorize.loginid}`; ws.send(JSON.stringify({ticks:"R_100"})); } if(d.tick){ const dig=Number(String(d.tick.quote).slice(-1)); document.getElementById("tick").innerText=d.tick.quote; last=[dig,...last].slice(0,100); document.getElementById("l100").innerText=last.length; renderDigits(); } };
}
(function(){ const p=new URLSearchParams(location.search); const t=p.get("token1")||localStorage.getItem("deriv_token"); if(t){ localStorage.setItem("deriv_token",t); connect(t); history.replaceState({}, "", "/"); } renderDigits(); renderBots(); })();
</script>
</body>
</html>
