<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Digits • Connecting</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#050d1c;
  color:#f2f7ff;
  font-family:system-ui;
  text-align:center;
}
.box{
  max-width:420px;
  padding:28px;
  border:1px solid #1d3d65;
  border-radius:18px;
  background:#091a31;
}
.muted{
  color:#8ea8c8;
}
button{
  padding:12px 18px;
  border:0;
  border-radius:10px;
  background:#188cff;
  color:white;
  font-weight:800;
}
</style>
</head>

<body>

<div class="box">
  <h1>🔐 Apex Digits</h1>
  <p id="msg" class="muted">Finishing secure Deriv connection…</p>
  <button id="back" style="display:none" onclick="location.href='/'">
    Return to Apex Digits
  </button>
</div>

<script>
(async()=>{
  const m=document.getElementById("msg");
  const b=document.getElementById("back");

  try{
    const q=new URLSearchParams(location.search);

    if(q.get("error")){
      throw new Error(
        q.get("error_description") || q.get("error")
      );
    }

    const code=q.get("code");
    const returned=q.get("state");
    const saved=sessionStorage.getItem("oauth_state");
    const verifier=sessionStorage.getItem("pkce_code_verifier");

    if(!code || !returned || returned!==saved){
      throw new Error(
        "Security check failed. Start the connection again."
      );
    }

    if(!verifier){
      throw new Error(
        "Secure login session expired. Try again."
      );
    }

    const r=await fetch("/api/oauth/exchange",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        code:code,
        verifier:verifier
      })
    });

    const d=await r.json();

    if(!r.ok){
      throw new Error(
        d.error || "Token exchange failed."
      );
    }

    sessionStorage.removeItem("oauth_state");
    sessionStorage.removeItem("pkce_code_verifier");

    m.textContent="Deriv is connected. Returning to Apex Digits…";

    location.replace("/?connected=1");

  }catch(e){
    m.textContent=e.message;
    b.style.display="inline-block";
  }
})();
</script>

</body>
</html>
